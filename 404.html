<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANABACUS | Redirecting...</title>
    <script>
        (function() {
            var path = window.location.pathname || '/';
            var segs = path.split('/').filter(Boolean);
            var last = (segs[segs.length - 1] || 'home').toLowerCase().replace(/.html$/, '');
            var map = {
                'about': 'comrades',
                'comrades': 'comrades',
                'test': 'virtual-abacus-test',
                'virtual-abacus-test': 'virtual-abacus-test',
                'gallery': 'gallery',
                'academics': 'academics',
                'branches': 'branches',
                'nitesh': 'nitesh',
                'news': 'news',
                'blogs': 'blogs',
                'contact': 'contact'
            };
            var targetHash = map[last] ? ('#' + map[last]) : '#home';
            var basePath = segs.length > 1 ? ('/' + segs.slice(0, -1).join('/') + '/') : '/';
            window.location.replace(window.location.origin + basePath + targetHash);
        })();
    </script>
</head>
<body style="background:#1e1b4b;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    Redirecting to ANABACUS...
</body>
</html>
